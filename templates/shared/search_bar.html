<form method="get" class="mb-4 flex flex-col gap-3 rounded-lg border border-slate-200 bg-white p-4 md:flex-row">
    <input
        type="text"
        name="q"
        value="{{ request.GET.q }}"
        placeholder="{{ placeholder|default:'Search records' }}"
        class="w-full rounded-md border border-slate-300 px-3 py-2"
    >
    {% if extra_filter_template %}
        {% include extra_filter_template %}
    {% endif %}
    <button type="submit" class="rounded-md bg-slate-900 px-4 py-2 font-medium text-white">Search</button>
</form>
