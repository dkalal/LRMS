{% for field in form %}
    <div>
        <label for="{{ field.id_for_label }}" class="mb-1 block text-sm font-medium text-slate-700">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}
            <p class="mt-1 text-xs text-slate-500">{{ field.help_text }}</p>
        {% endif %}
        {% if field.errors %}
            <p id="{{ field.id_for_label }}-error" class="mt-1 text-sm text-red-600">Error: {{ field.errors|join:", " }}</p>
        {% endif %}
    </div>
{% endfor %}
