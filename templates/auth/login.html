{% extends "base.html" %}

{% block title %}Login | LRMS{% endblock %}

{% block content %}
<div class="mx-auto max-w-md rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
    <h2 class="mb-2 text-2xl font-semibold">Sign in</h2>
    <p class="mb-6 text-sm text-slate-500">Use your tenant staff account to continue.</p>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% include "shared/form_fields.html" with form=form %}
        <button type="submit" class="w-full rounded-md bg-brand-600 px-4 py-3 font-medium text-white">Login</button>
    </form>
</div>
{% endblock %}
